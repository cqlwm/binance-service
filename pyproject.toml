[project]
name = "binance-service"
version = "0.2.5"
description = "通过 Chrome 自动化操作币安（Binance）的命令行工具集，复用本地 Chrome 登录态，无需 API Key"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "pytest-playwright>=0.8.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
binance = "binance_service.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["binance_service"]

[tool.ruff]
line-length = 120

[tool.uv]
package = true

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
ignore = ["*_service/type_wrapper/*_wrapper.py"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.21",
]
