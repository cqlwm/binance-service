[project]
name = "binance-service"
version = "0.2.3"
description = "通过 Chrome 自动化操作币安（Binance）的命令行工具集，复用本地 Chrome 登录态，无需 API Key"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "pillow>=12.2.0",
    "pytest-playwright>=0.8.0",
]

[project.scripts]
binance-post = "binance_service.poster:main"
binance-screenshot = "binance_service.screenshot:main"
binance-save-storage = "binance_service.save_storage:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.pyright]
typeCheckingMode = "strict"
ignore = ["binance_service/type_wrapper/*_wrapper.py"]
